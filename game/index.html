<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERLINE — Solo Breach</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", system-ui, sans-serif; color: #ece7db; user-select: none; }
  #hud .overlay { pointer-events: auto; }
  .panel { position: absolute; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .top-left { top: 16px; left: 18px; }
  .top-center { top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
  .top-right { top: 16px; right: 18px; text-align: right; }
  .bottom-right { bottom: 18px; right: 20px; text-align: right; }
  .bottom-left { bottom: 18px; left: 20px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .label { font-size: 12px; letter-spacing: 2px; color: #8b959e; font-weight: 700; }
  .num { font-size: 20px; font-weight: 800; }
  .money { color: #f0a830; }
  .bar { width: 180px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid #2b323a; }
  .bar .fill { height: 100%; background: #f0a830; transition: width .15s; }
  .bar .fill.amber { background: #f0a830; }
  .timer { font-size: 30px; font-weight: 800; line-height: 1; }
  .score { font-size: 15px; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }
  .round { font-size: 11px; letter-spacing: 2px; color: #8b959e; margin-top: 2px; }
  .alive { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-bottom: 6px; }
  .dots { font-size: 13px; letter-spacing: 2px; color: #f0a830; }
  .feed { font-size: 13px; }
  .feed-item { background: rgba(0,0,0,.55); padding: 3px 8px; margin-bottom: 4px; border-right: 3px solid #f0a830; }
  .weapon { font-size: 17px; font-weight: 700; }
  .ammo { font-size: 30px; font-weight: 800; line-height: 1.05; }
  .hint { font-size: 12px; color: #e5484d; min-height: 15px; }
  .bomb { font-size: 14px; font-weight: 700; }
  .progress-wrap { margin-top: 6px; width: 220px; }
  .progress-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 3px; color: #f0a830; }
  .crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; }
  .crosshair .ch-dot { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px; background: #ece7db; border-radius: 50%; box-shadow: 0 0 3px #000; }
  .crosshair .ch-t, .crosshair .ch-b { position: absolute; left: -1px; width: 2px; height: 9px; background: #ece7db; box-shadow: 0 0 3px #000; }
  .crosshair .ch-t { top: calc(-1 * var(--gap) - 9px); }
  .crosshair .ch-b { top: var(--gap); }
  .crosshair .ch-l, .crosshair .ch-r { position: absolute; top: -1px; height: 2px; width: 9px; background: #ece7db; box-shadow: 0 0 3px #000; }
  .crosshair .ch-l { left: calc(-1 * var(--gap) - 9px); }
  .crosshair .ch-r { left: var(--gap); }
  .hitmarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 900; color: #ece7db; opacity: 0; text-shadow: 0 0 4px #000; }
  .hitmarker.kill { color: #f0a830; font-size: 34px; }
  .vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(229,72,77,.55) 100%); }
  .banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .banner-title { font-size: 44px; font-weight: 900; letter-spacing: 3px; }
  .banner-sub { font-size: 16px; margin-top: 4px; }
  .banner.win .banner-title { color: #f0a830; }
  .banner.lose .banner-title { color: #e5484d; }
  .buy { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 300px; background: rgba(10,12,16,.88); border: 1px solid #2b323a; padding: 12px 14px; }
  .buy-title { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #f0a830; margin-bottom: 8px; }
  .buy-row { display: flex; gap: 8px; align-items: center; padding: 5px 4px; font-size: 14px; border-bottom: 1px solid #1b2026; }
  .buy-row.current { background: rgba(240,168,48,.14); }
  .buy-row.owned .buy-name { color: #8b959e; }
  .buy-key { display: inline-block; min-width: 20px; text-align: center; font-weight: 800; color: #f0a830; border: 1px solid #f0a830; padding: 0 3px; font-size: 12px; }
  .buy-name { flex: 1; }
  .buy-price { color: #f0a830; font-weight: 700; }
  .buy-money { margin-top: 8px; font-size: 14px; font-weight: 800; color: #f0a830; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(10,13,18,.72); cursor: pointer; }
  .game-name { font-size: 64px; font-weight: 900; letter-spacing: 10px; color: #f0a830; text-shadow: 0 3px 18px rgba(0,0,0,.9); }
  .game-name.small { font-size: 44px; }
  .game-sub { font-size: 17px; margin-top: 6px; color: #ece7db; }
  .game-desc { max-width: 560px; margin-top: 16px; font-size: 15px; line-height: 1.55; color: #c8cdd4; }
  .controls { margin-top: 18px; font-size: 14px; line-height: 1.9; color: #8b959e; }
  .controls b { color: #ece7db; }
  .click-start { margin-top: 26px; font-size: 19px; font-weight: 800; letter-spacing: 2px; color: #f0a830; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .mute-tag { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 2px; color: #8b959e; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="EMBERLINE: plant the charge at site A or B, or eliminate the three CINDER defenders"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
